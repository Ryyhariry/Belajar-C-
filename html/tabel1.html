<!DOCTYPE html>
<html>
<head>
    <title>Contoh Struktur Tabel HTML</title>
</head>
<body>
    <h2>Daftar Nilai Siswa</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th rowspan="2">Nama</th>
            <th colspan="2">Nilai</th>
            <th rowspan="2">Rata-rata</th>
        </tr>
        <tr>
            <th>Matematika</th>
            <th>Bahasa</th>
        </tr>
        <tr>
            <td>Stevani</td>
            <td>85</td>
            <td>90</td>
            <td>87.5</td>
        </tr>
        <tr>
            <td>Maret Tantri</td>
            <td>80</td>
            <td>88</td>
            <td>84</td>
        </tr>
    </table>
</body>
</html>
